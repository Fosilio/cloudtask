---
- name: Install BIND9 DNS packages
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure TSIG key
  ansible.builtin.template:
    src: cloudtask.key.j2
    dest: /etc/bind/cloudtask.key
    owner: root
    group: bind
    mode: '0640'
  no_log: true
  notify: Restart BIND9

- name: Configure BIND9 options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: '0644'
  notify: Restart BIND9

- name: Create initial DNS zone
  ansible.builtin.template:
    src: db.cloudtask.test.j2
    dest: "{{ dns_zone_directory }}/db.{{ dns_zone }}"
    owner: bind
    group: bind
    mode: '0644'
    force: false
  notify: Restart BIND9

- name: Configure authoritative DNS zone
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: '0644'
  notify: Restart BIND9

- name: Validate BIND9 configuration
  ansible.builtin.command: named-checkconf
  changed_when: false

- name: Enable and start BIND9
  ansible.builtin.service:
    name: named
    state: started
    enabled: true

- name: Apply DNS configuration changes
  ansible.builtin.meta: flush_handlers

- name: Verify authoritative DNS zone
  ansible.builtin.command:
    cmd: "dig @127.0.0.1 {{ dns_zone }} SOA +short"
  register: dns_soa
  changed_when: false
  failed_when: dns_soa.rc != 0 or dns_soa.stdout | length == 0